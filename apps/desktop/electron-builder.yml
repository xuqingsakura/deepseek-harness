appId: com.deepseek-ai.dsh-desktop
productName: DeepSeek Harness
directories:
  # Overridden by package:desktop via DSH_PKG_OUTPUT_DIR on CI (this local
  # default keeps bare electron-builder runs working on the dev machine).
  output: C:/Users/苏铭/AppData/Local/Temp/dsh-pkg
  buildResources: build
files:
  - lib/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: out/runtime
    to: runtime
    # A stale half-deleted closure (pnpm hard links refuse deletion) must not
    # ship; the packaging deploy step always rebuilds out/runtime/host-deploy.
    filter:
      - "**/*"
      - "!host-deploy-stale/**"
  # Vendored pnpm (official dsh plugin installer) shipped for Settings → Plugins.
  - from: runtime/pnpm
    to: pnpm
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
publish:
  # Desktop releases are published to this repo's GitHub Releases by
  # .github/workflows/desktop-release.yml; the baked app-update.yml lets
  # Settings -> About check for updates against GitHub. DSH_UPDATE_FEED_URL or
  # %APPDATA%\dsh-desktop\update-config.json still override at runtime.
  - provider: github
    owner: xuqingsakura
    repo: deepseek-harness
nsis:
  oneClick: false
  # Always per-machine: the previous per-user/per-machine mix made silent
  # upgrades fail (exit 2) and forced uninstall-then-install. One scope means a
  # later Setup.exe overwrites the earlier install in place.
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  uninstallDisplayName: DeepSeek Harness
