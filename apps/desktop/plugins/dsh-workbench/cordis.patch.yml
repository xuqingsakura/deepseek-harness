# Workbench bundle patch: mounts the session-scoped workbench gateway (host)
# and the workbench UI (client). Both packages ship inside the desktop
# runtime closure (web-app dependency); this patch is what turns them on, so
# the desktop starts without the workbench until this plugin is installed.
- insert:
    - id: workbench
      name: '@deepseek-ai/dsh-host-workbench'

    - id: ui-workbench
      name: '@deepseek-ai/dsh-client-ui-workbench'
